<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maoni | maoni.store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #fafafa; color: #111; }
        .img-container { opacity: 0; transform: translateY(20px); animation: fadeInUp 1.2s forwards; }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="selection:bg-black selection:text-white">

    <nav class="p-8 flex justify-between items-center">
        <span class="text-xl tracking-[0.3em] font-light uppercase">Maoni</span>
        <span class="text-[10px] tracking-widest text-gray-400 uppercase">Est. 2026</span>
    </nav>

    <main class="max-w-screen-md mx-auto px-6 pb-24">
        <div class="img-container">
            <div class="aspect-[4/5] overflow-hidden rounded-sm shadow-sm bg-white">
                <img src="hero.jpg" alt="Maoni Early Morning" class="w-full h-full object-cover">
            </div>
            
            <div class="mt-12 text-center space-y-4">
                <h2 class="text-2xl font-light tracking-tight">The First Morning</h2>
                <p class="text-gray-500 text-sm leading-relaxed max-w-xs mx-auto">
                    "Soft light, white tee, and the quiet before the world wakes up."
                </p>
                <div class="pt-6">
                    <div class="inline-block h-[1px] w-12 bg-gray-300"></div>
                </div>
            </div>
        </div>

        <section class="mt-32 space-y-24">
            <div class="text-[10px] text-center tracking-[0.5em] text-gray-300 uppercase italic">
                More scenes arriving soon
            </div>
        </section>
    </main>

    <footer class="p-12 text-center border-t border-gray-100">
        <p class="text-[10px] tracking-widest text-gray-400 uppercase">© 2026 maoni.store</p>
    </footer>

</body>
</html>
